<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Cập Nhật</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00639B;
            --primary-color-dark: #004a74;
            --on-primary-color: #FFFFFF;
            --surface-container-low: #F6F9FF;
            --surface-container-lowest: #FFFFFF;
            --on-surface-color: #1A1C1E;
            --on-surface-variant-color: #43474E;
            --outline-color: #73777F;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--surface-container-low);
            color: var(--on-surface-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .update-card {
            background-color: var(--surface-container-lowest);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fade-in 0.5s ease-out;
        }
        
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .update-header {
            padding: 24px 28px;
            background-color: var(--primary-color);
            color: var(--on-primary-color);
            text-align: center;
        }

        .update-header h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .update-header p {
            font-size: 1em;
            opacity: 0.9;
        }

        .update-body {
            padding: 28px;
        }

        .version-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--on-surface-variant-color);
        }

        .info-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .info-item .label {
            font-size: 0.9em;
            display: block;
        }
        
        .info-item .value {
            font-size: 1em;
            font-weight: 500;
            color: var(--on-surface-color);
            display: block;
        }

        .changelog h2 {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--on-surface-color);
        }

        .changelog ul {
            list-style: none;
            padding-left: 0;
        }

        .changelog li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--on-surface-variant-color);
        }
        
        .changelog li svg {
            width: 20px;
            height: 20px;
            fill: var(--success-color);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .update-actions {
            padding: 20px 28px;
            text-align: center;
            background-color: var(--surface-container-low);
            border-top: 1px solid #e0e0e0;
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--primary-color);
            color: var(--on-primary-color);
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 99, 155, 0.2);
        }

        .btn-download:hover {
            background-color: var(--primary-color-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 99, 155, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .update-header h1 {
                font-size: 1.5em;
            }

            .update-body, .update-actions, .update-header {
                padding: 20px;
            }
            
            .version-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="update-card">
            <header class="update-header">
                <h1 id="update-title">Đã có bản cập nhật</h1>
                <p id="update-message">Một bản cập nhật quan trọng đã được phát hành để cải thiện trải nghiệm của bạn.</p>
            </header>
            
            <div class="update-body">
                <section class="version-info">
                    <div class="info-item">
                        <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 18.43 17 20.57 14.86M12 18H15V21H12V18M12 6H15V9H12V6M5.43 17L7 15.57 3.43 12 2 13.43 5.43 17M12 10H15V13H12V10M12 2H15V5H12V2M18.43 7L17 5.57 20.57 2 22 3.43 18.43 7M5.43 7L7 8.43 3.43 12 2 10.57 5.43 7Z"/></svg>
                        <div>
                            <span class="label">Phiên bản mới</span>
                            <span class="value" id="version-name">1.0.3</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <svg viewBox="0 0 24 24"><path d="M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H18V1M17,12H12V17H17V12Z"/></svg>
                        <div>
                            <span class="label">Ngày phát hành</span>
                            <span class="value" id="release-date">18/01/2026</span>
                        </div>
                    </div>
                </section>

                <section class="changelog">
                    <h2>Có gì mới?</h2>
                    <ul id="changelog-list">
                        <!-- Các mục changelog sẽ được chèn vào đây -->
                        <li>
                            <svg viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" /></svg>
                            <span>Cải thiện độ bảo mật và ổn định.</span>
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" /></svg>
                            <span>Cải thiện trải nghiệm điều hướng.</span>
                        </li>
                        <li>
                            <svg viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" /></svg>
                            <span>Sửa một số lỗi đã biết.</span>
                        </li>
                    </ul>
                </section>
            </div>

            <footer class="update-actions">
                <a id="download-button" target="_blank" href="https://www.ttkt.is-a.dev/p/app.html" class="btn-download">
                    Tải Về Ngay
                </a>
            </footer>
        </div>
    </div>

    <script>
        // --- LOGIC ĐỂ TRANG NÀY TỰ ĐỘNG CẬP NHẬT DỮ LIỆU ---
        // Đoạn script này giúp trang có thể tự điền thông tin nếu bạn truyền
        // dữ liệu qua URL parameters (ví dụ: update-info.html?version=1.1.0&date=...)
        // Điều này rất hữu ích nếu bạn muốn tạo nhiều trang cập nhật mà không cần sửa file HTML.

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);

            // Các hàm trợ giúp
            const setText = (id, value) => {
                const el = document.getElementById(id);
                if (el && value) el.textContent = value;
            };

            const setHref = (id, value) => {
                const el = document.getElementById(id);
                if (el && value) el.href = value;
            };

            // Cập nhật các trường dữ liệu từ URL parameters
            setText('update-title', params.get('title'));
            setText('update-message', params.get('message'));
            setText('version-name', params.get('versionName'));
            setText('release-date', params.get('releaseDate'));
            setHref('download-button', params.get('downloadUrl'));

            // Xử lý changelog (mong muốn có dạng ?changelog=Item 1|Item 2|Item 3)
            const changelogParam = params.get('changelog');
            if (changelogParam) {
                const changelogList = document.getElementById('changelog-list');
                const items = changelogParam.split('|');
                
                changelogList.innerHTML = ''; // Xóa các mục mặc định

                items.forEach(itemText => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <svg viewBox="0 0 24 24"><path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" /></svg>
                        <span>${itemText.trim()}</span>
                    `;
                    changelogList.appendChild(li);
                });
            }
        });
    </script>
</body>
</html>
